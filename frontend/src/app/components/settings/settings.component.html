<div class="settings-grid">
  <form class="panel profile-editor" (ngSubmit)="save()">
    <h2>Información pública</h2>
    <p>Fotos y banners: JPEG, PNG o WebP, hasta 10 MB por imagen.</p>
    <div class="settings-profile-preview">
      <input
        #bannerPicker
        class="settings-file-input"
        type="file"
        hidden
        accept="image/jpeg,image/png,image/webp"
        [disabled]="busy()"
        (change)="image($event, 'banner')"
      />
      <div
        class="settings-profile-banner settings-banner-picker"
        role="button"
        tabindex="0"
        aria-label="Seleccionar imagen del banner"
        [attr.aria-disabled]="busy()"
        [style.background-image]="bannerPreview ? 'url(' + bannerPreview + ')' : ''"
        (click)="!busy() && bannerPicker.click()"
        (keydown.enter)="!busy() && bannerPicker.click()"
        (keydown.space)="$event.preventDefault(); !busy() && bannerPicker.click()"
      >
      </div>
      <input
        #photoPicker
        class="settings-file-input"
        type="file"
        hidden
        accept="image/jpeg,image/png,image/webp"
        [disabled]="busy()"
        (change)="image($event, 'foto')"
      />
      <div
        class="settings-photo-wrap settings-photo-picker"
        role="button"
        tabindex="0"
        aria-label="Seleccionar foto de perfil"
        [attr.aria-disabled]="busy()"
        (click)="!busy() && photoPicker.click()"
        (keydown.enter)="!busy() && photoPicker.click()"
        (keydown.space)="$event.preventDefault(); !busy() && photoPicker.click()"
      >
        <img
          class="settings-profile-avatar"
          [src]="photoPreview"
          alt="Foto de perfil"
        />
      </div>
    </div>
    <div class="settings-profile-fields">
      <label
        >Nombre público<input
          [(ngModel)]="form.nombre"
          name="nombre"
          minlength="2"
          maxlength="60"
          required
      /></label>
      <label
        >Nombre de usuario<input
          [(ngModel)]="form.nombre_usuario"
          name="usuario"
          pattern="[A-Za-z0-9_]{3,24}"
          required
      /></label>
      <label class="settings-description-field"
        >Descripción<input
          [(ngModel)]="form.descripcion"
          name="descripcion"
          maxlength="300"
      /></label>
    </div>
    <div class="profile-editor-actions">
      <button class="pixel-save-cta" [disabled]="busy()">
        <span class="pixel-button-label">Guardar cambios</span>
      </button>
      <button type="button" class="quiet danger" (click)="erase()" [disabled]="busy()">
        <span class="pixel-button-label">Eliminar cuenta</span>
      </button>
      <button type="button" class="quiet" (click)="session.logout()">
        <span class="pixel-button-label">Cerrar sesión</span>
      </button>
    </div>
    @if (error()) {
      <p class="alert">{{ error() }}</p>
    }
    @if (notice()) {
      <p class="success">{{ notice() }}</p>
    }
  </form>
</div>
