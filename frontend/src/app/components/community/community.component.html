<section class="page-heading">
  <p class="eyebrow">COMUNIDAD</p>
  <h1>Encuentra a tu equipo.</h1>
  <form class="search-row" (ngSubmit)="search()">
    <input
      aria-label="Buscar perfiles"
      [(ngModel)]="query"
      name="buscar"
      placeholder="Buscar nombre o @usuario…"
    /><button class="community-search-cta"><span class="pixel-button-label">Buscar</span></button>
  </form>
</section>
@if (error()) {
  <p class="alert">{{ error() }}</p>
}
<div class="people-grid">
  @for (p of profiles(); track p.id_usuario) {
    <article class="panel person">
      <div
        class="person-banner"
        [style.background-image]="
          p.banner_url ? 'url(' + p.banner_url + ')' : ''
        "
      ></div>
      <img class="avatar" [src]="p.foto_url || '/avatar.svg'" alt="" />
      <h3>{{ p.nombre }}</h3>
      <a [routerLink]="['/perfil', p.nombre_usuario]"
        >&#64;{{ p.nombre_usuario }}</a
      >
      <a class="button community-profile-cta" [routerLink]="['/perfil', p.nombre_usuario]"><span class="pixel-button-label">Ver perfil</span></a>
    </article>
  } @empty {
    <div class="empty">
      <h2>No se encontraron resultados.</h2>
    </div>
  }
</div>
