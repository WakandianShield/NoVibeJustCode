<section class="page-heading">
  <p class="eyebrow">EXPLORA LAS RUTAS</p>
  <h1>Elige qué construir.</h1>
  @if (error()) {
    <p class="alert">{{ error() }}</p>
  }
</section>
<div class="course-grid">
  @for (c of courses(); track c.id_curso) {
    <a class="course-card" [routerLink]="['/curso', c.id_curso]">
      <div class="course-art">
        @if (logosFor(c).length) {
          <div class="course-logos" aria-hidden="true">
            @for (logo of logosFor(c); track logo) {
              <img src="{{ logo }}" alt="" loading="lazy" />
            }
          </div>
        } @else {
          <span class="course-logo-fallback" aria-hidden="true">
            {{ c.tecnologia || c.titulo }}
          </span>
        }
      </div>
      <div class="card-body">
        <h3>{{ c.titulo }}</h3>
        <span class="exercise-badge">10 secciones</span>
      </div>
    </a>
  }
</div>
